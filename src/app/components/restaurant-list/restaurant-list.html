<h2 class="mt-4 mb-4">Lista restauracji</h2>

<div class="mb-3">
  <label class="form-label" for="searchInput">Wpisz nazwę restauracji</label>
  <input
    class="form-control"
    type="search"
    #searchInput
    [value]="search()"
    (input)="onSearch(searchInput.value)"
    placeholder="Wpisz wartość..."
    id="searchInput"
  />
</div>

<div class="mb-3">
  <label class="form-label" for="cuisineSelect">Wybierz rodzaj</label>
  <select
    class="form-select"
    #cuisineSelect
    [value]="cuisine()"
    (change)="onCuisineChange(cuisineSelect.value)"
    id="cuisineSelect"
  >
    <option selected value="">Wszystkie</option>
    @for (c of cuisineOptions; track c) {
      <option [value]="c">{{c}}</option>
    }
  </select>
</div>

<div class="form-check mb-3">
  <input
    class="form-check-input"
    type="checkbox"
    #onlyActiveCheckbox
    [checked]="onlyActive()"
    (change)="onOnlyActiveChange(onlyActiveCheckbox.checked)"
    id="onlyActiveCheckbox"
  />
  <label class="form-check-label" for="onlyActiveCheckbox">Czy aktywna</label>
</div>

<div class="mb-3">
  <label class="form-label" for="sortSelect">Kolejność sortowania</label>
  <select
    class="form-select"
    #sortSelect
    (change)="onSortChange(sortSelect.value)"
    id="sortSelect"
    [value]="sortBy()"
  >
    @for (o of sortOptions; track o) {
      <option [value]="o.value">{{o.label}}</option>
    }
  </select>
</div>

<button
  class="btn btn-outline-secondary mt-4"
  (click)="onReset()"
>
  Wyczyść filtry
</button>


<section class="list mt-4">
  @for (restaurant of restaurants(); track restaurant.id) {
    <app-restaurant-card [restaurant]="restaurant" />
  } @empty {
    <div class="no-restaurants">Nie znaleziono restauracji.</div>
  }
</section>
